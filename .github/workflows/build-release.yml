name: Build Windows Executables

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executables
        run: .\build.bat /nopause

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            dist/DJI-RC-N1-Simulator.exe
            dist/Xbox-Controller-Tester.exe
          if-no-files-found: error

      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          Compress-Archive -Path dist\DJI-RC-N1-Simulator.exe, dist\Xbox-Controller-Tester.exe -DestinationPath dist\DJI-RC-N1-Simulator-Windows.zip -Force

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DJI-RC-N1-Simulator.exe
            dist/Xbox-Controller-Tester.exe
            dist/DJI-RC-N1-Simulator-Windows.zip
          generate_release_notes: true
